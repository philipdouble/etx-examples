seed_examples:
  - context: Design and build accessible Portable Document Format (PDF) tables
    questions_and_answers:
      - question: What are the best practices for designing accessible PDF tables?
        answer: |-
          Best practices for designing accessible PDF tables include:
                      - Use simple and clear table structures.
                      - Include headers for each column and row.
                      - Avoid merged cells when possible.
      - question: How can I ensure that my PDF tables are accessible to screen readers?
        answer: |-
          To ensure that PDF tables are accessible to screen readers:
                      - Use proper tagging for tables in the PDF.
                      - Include alternative text for images within the table.
                      - Use logical reading order and structure.
      - question: What tools can I use to check the accessibility of PDF tables?
        answer: |-
          Tools to check the accessibility of PDF tables include:
                      - Adobe Acrobat Pro's accessibility checker.
                      - PAC 3 (PDF Accessibility Checker).
                      - CommonLook PDF Validator.
                      - Axe for PDFs.
  - context: example of footnotes
    questions_and_answers:
      - question: Where do the footnotes appear?
        answer: >-
          There should be a blank line after the table to start the section for
          footnotes.
      - question: How should footnotes be formatted in a PDF table?
        answer: >-
          Footnotes should be numbered sequentially and placed at the bottom of
          the table, with a clear distinction from the table content.
      - question: Can footnotes be used to provide additional information in PDF tables?
        answer: >-
          Yes, footnotes can be used to provide additional information or
          clarifications related to the table content, enhancing the
          understanding of the data presented.
  - context: film credits" style layout
    questions_and_answers:
      - question: What is the first column
        answer: >-
          The first column is the "Actor" column, which lists the various actors
          involved in the film credits.
      - question: What is the second column
        answer: >-
          The second column is the "Role" column, which contains the names of
          roles associated with each actor.
      - question: How many calumns are there in the "film credits" style layout?
        answer: >-
          There are two columns in the "film credits" style layout: "Actor" and
          "Role".
  - context: year-end statement, current assets
    questions_and_answers:
      - question: >-
          What information goes in the first column of a year-end statement for
          current assets?
        answer: The first column is Current Assets and each item is one asset.
      - question: What information goes in the column headers for column 2 and beyond?
        answer: The year goes in the header for columns 2 and beyond.
      - question: How many rows can be in the table?
        answer: >-
          The current assets table should have one row for each asset, plus the
          header.
  - context: footnotes referenced from within a table
    questions_and_answers:
      - question: How do you reference a footnote from within a table?
        answer: >-
          After the entry needing a reference, place a space and then the number
          of the reference, which must match the number of the footnote.
      - question: >-
          Can you reference more than one thing from the same place in the
          table?
        answer: >-
          To reference more than one thing, enter each reference in a comma
          separated list.
      - question: Do all footnotes need to be referenced in the table?
        answer: >-
          No, there may be footnotes that are not referenced from data in the
          table.
