seed_examples:
  - context: |
        Design and build accessible Portable Document Format (PDF) tables
    questions_and_answers:
      - question: |
            What are the best practices for designing accessible PDF tables?
        answer: |
            Best practices for designing accessible PDF tables include:
            - Use simple and clear table structures.
            - Include headers for each column and row.
            - Avoid merged cells when possible.
            - Ensure sufficient color contrast between text and background.
            - Provide descriptive captions for tables.
      - question: |
            How can I ensure that my PDF tables are accessible to screen readers?
        answer: |
            To ensure that PDF tables are accessible to screen readers:
            - Use proper tagging for tables in the PDF.
            - Include alternative text for images within the table.
            - Use logical reading order and structure.
            - Test the PDF with screen reader software to verify accessibility.
      - question: |
            What tools can I use to check the accessibility of PDF tables?
        answer: |
            Tools to check the accessibility of PDF tables include:
            - Adobe Acrobat Pro's accessibility checker.
            - PAC 3 (PDF Accessibility Checker).
            - CommonLook PDF Validator.
            - Axe for PDFs.
            - NVDA or JAWS screen readers for manual testing.
  - context: |
        example of footnotes
    questions_and_answers:
      - question: |
            Where do the footnotes appear?
        answer: |
            There should be a blank line after the table to start the section for footnotes.
      - question: |
            How should footnotes be formatted in a PDF table?
        answer: |
            Footnotes should be numbered sequentially and placed at the bottom of the table, with a clear distinction from the table content.
      - question: |
            Can footnotes be used to provide additional information in PDF tables?
        answer: |
            Yes, footnotes can be used to provide additional information or clarifications related to the table content, enhancing the understanding of the data presented.
  - context: |
        "film credits" style layout
